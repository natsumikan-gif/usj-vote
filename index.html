<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USJ旅行プラン投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#eef1f8;--card:#fff;
  --navy:#002b6e;--blue:#0057b8;--sky:#0099d9;--purple:#7c3aed;
  --text:#111827;--sub:#6b7280;--border:#e5e7eb;--yellow:#ffd700;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;}

/* PASSWORD */
#pw-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1.5rem;}
.pw-card{background:var(--card);border-radius:20px;box-shadow:0 8px 32px rgba(0,40,120,0.12);padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center;}
.pw-emoji{font-size:48px;margin-bottom:12px;}
.pw-title{font-size:20px;font-weight:900;color:var(--navy);margin-bottom:6px;}
.pw-sub{font-size:13px;color:var(--sub);margin-bottom:1.5rem;line-height:1.6;}
.pw-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:'Noto Sans JP',sans-serif;color:var(--text);text-align:center;letter-spacing:.2em;margin-bottom:.75rem;transition:border-color .15s;}
.pw-input:focus{outline:none;border-color:var(--sky);}
.pw-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:background .15s;}
.pw-btn:hover{background:var(--blue);}
.pw-error{font-size:12px;color:#dc2626;margin-top:6px;min-height:18px;}

/* APP */
#app{display:none;}
.page{padding:2rem 1.25rem 3rem;max-width:1100px;margin:0 auto;}
.header{text-align:center;margin-bottom:1.75rem;}
.header h1{font-size:26px;font-weight:900;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px;}
.header p{font-size:13px;color:var(--sub);}

.panel{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:1.5rem;margin-bottom:1.25rem;}
.panel-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:1rem;}
.field-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;}
.name-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:#fff;transition:border-color .15s;margin-bottom:1.5rem;}
.name-input:focus{outline:none;border-color:var(--sky);}
.name-input:disabled{background:#f9fafb;color:var(--sub);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
@media(max-width:640px){.two-col{grid-template-columns:1fr;}}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.sec-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--text);}
.sec-badge{font-size:12px;color:var(--sub);background:#f3f4f6;border-radius:99px;padding:2px 10px;font-weight:500;}

.item-list{display:flex;flex-direction:column;gap:6px;}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#fff;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;user-select:none;}
.item:hover{border-color:var(--sky);background:#f0f8ff;}
.item.sel-1{border-color:#f59e0b;background:#fffbeb;box-shadow:0 0 0 1px #f59e0b;}
.item.sel-2{border-color:#9ca3af;background:#f9fafb;box-shadow:0 0 0 1px #9ca3af;}
.item.sel-3{border-color:#cd7c3a;background:#fef3e8;box-shadow:0 0 0 1px #cd7c3a;}
.item.disabled{opacity:.38;cursor:not-allowed;}
.item.skip{border-style:dashed;border-color:#d1d5db;}
.item.skip:hover{border-color:var(--yellow);}
.item.sel-skip{border-color:#ea580c;background:#fff7ed;box-shadow:0 0 0 1px #ea580c;}
.item-thumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#e0e7ff,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.item-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;flex:1;}
.item-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.rank-pip{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.pip-1{background:#f59e0b;color:#78350f;}
.pip-2{background:#9ca3af;color:#1f2937;}
.pip-3{background:#cd7c3a;color:#fff;}
.pip-skip{background:#fde68a;color:#92400e;}

.area-div{font-size:11px;font-weight:700;color:var(--purple);letter-spacing:.06em;display:flex;align-items:center;gap:6px;margin:10px 0 5px;padding:0 2px;}
.area-div::after{content:'';flex:1;height:1px;background:#ede9fe;}

.submit-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .15s;margin-top:1.25rem;}
.submit-btn:hover{background:var(--blue);}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;}

.voter-section{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:1rem 1.5rem;margin-bottom:1.25rem;}
.voter-head{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px;}
.voter-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;background:#f3f4f6;border:1px solid var(--border);color:var(--sub);}
.chip.me{background:#e8f5fb;border-color:var(--sky);color:var(--blue);font-weight:700;}

.rank-panel{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:1.5rem;}
.rank-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.rank-title{font-size:16px;font-weight:700;color:var(--text);}
.refresh-btn{font-size:12px;color:var(--sub);background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.refresh-btn:hover{background:#f9fafb;}

.rank-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6;}
.rank-row:last-child{border-bottom:none;}
.rank-num{width:24px;font-size:16px;font-weight:700;color:#9ca3af;text-align:center;flex-shrink:0;}
.rank-num.top{color:var(--text);}
.rank-thumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#e0e7ff,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.rank-name{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.4;}
.votes-badge{font-size:12px;background:#f3f4f6;border-radius:99px;padding:3px 10px;color:var(--sub);white-space:nowrap;flex-shrink:0;}
.votes-badge.has{background:#e8f5fb;color:var(--blue);font-weight:700;}
.voted-by{font-size:10px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;}
.voted-by span{background:#f3f4f6;border-radius:4px;padding:1px 5px;}
.voted-by span.r1{background:#fef9c3;color:#92400e;}
.voted-by span.r2{background:#f3f4f6;color:#374151;}
.voted-by span.r3{background:#fef3e8;color:#92400e;}
.rank-section{margin-top:1.25rem;}
.empty-msg{font-size:13px;color:#c0c4cc;padding:8px 0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div id="pw-screen">

    <div class="pw-sub">このページはメンバー限定です。<br>パスワードを入力してください。</div>

<div id="app">
<div class="page">
  <div class="header">

    <div class="two-col">

        <div class="sec-head">
          <div class="sec-title"><span>🍴</span>食べたいもの</div>
          <div class="sec-badge" id="food-count">0/3 選択中</div>

    <button class="submit-btn" id="submitBtn" onclick="submitVote()">投票する 🎉</button>

  </div>

  <div class="two-col rank-section">
    <div class="rank-panel">
      <div class="rank-head">
        <div class="rank-title">📈 アトラクション人気ランキング</div>

      </div>
      <div id="rides-rank"><div class="empty-msg">読み込み中...</div></div>
    </div>
    <div class="rank-panel">
      <div class="rank-head">
        <div class="rank-title">📈 食べ物人気ランキング</div>
      </div>
      <div id="food-rank"><div class="empty-msg">読み込み中...</div></div>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 設定（ここだけ変更OK） ==========
const PASSWORD     = 'usj2026';  // ← パスワードを変えるならここ
const SUPABASE_URL = 'https://huinncpseglimjirvvok.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1aW5uY3BzZWdsaW1qaXJ2dm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Nzc2NzAsImV4cCI6MjA5MzM1MzY3MH0.jB4mhugTZNsIdfip9HbTAegvAhrTDtz4xxS5BFwcsqY';
// =============================================

function checkPw(){
  const val=document.getElementById('pwInput').value;
  const err=document.getElementById('pwError');
  if(val===PASSWORD){
    document.getElementById('pw-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadResults();
  }else{
    err.textContent='パスワードが違います';
    document.getElementById('pwInput').value='';
    setTimeout(()=>err.textContent='',2000);
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ===== Supabase API =====
async function sbFetch(path,method='GET',body=null){
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{
    method,
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json',
      'Prefer': method==='POST'?'resolution=merge-duplicates,return=minimal':'',
    },
    body:body?JSON.stringify(body):null
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  if(res.status===204||res.headers.get('content-length')==='0')return null;
  return res.json();
}

// ===== データ =====
const RIDE_AREAS=[
  {area:'スーパー・ニンテンドー・ワールド',icon:'🍄',rides:[
    {id:'r1',icon:'🏎️',name:'マリオカート〜クッパの挑戦状〜',sub:'大人気ARライド'},
    {id:'r2',icon:'🐢',name:'ヨッシー・アドベンチャー',sub:'のんびり探検ライド'},
    {id:'r3',icon:'⭐',name:'パワーアップバンド・キーチャレンジ',sub:'体験型アクティビティ'},
    {id:'r4',icon:'🍌',name:'ドンキーコングのクレイジー・トロッコ',sub:'ジャングルコースター'},
  ]},
  {area:'ミニオン・パーク',icon:'🟡',rides:[
    {id:'r5',icon:'🎯',name:'ミニオン・ハチャメチャ・ミッション',sub:'大悪党への道'},
    {id:'r6',icon:'🎢',name:'ミニオン・ハチャメチャ・ライド',sub:'4Dシミュレーション'},
  ]},
  {area:'ウィザーディング・ワールド・オブ・ハリー・ポッター',icon:'🏰',rides:[
    {id:'r8',icon:'🧙',name:'ハリポタ・フォービドゥン・ジャーニー',sub:'ホグワーツ城'},
    {id:'r9',icon:'🦅',name:'フライト・オブ・ザ・ヒッポグリフ™',sub:'屋外コースター'},
    {id:'r10',icon:'🪄',name:'ワンド・マジック',sub:'魔法体験アクティビティ'},
  ]},
  {area:'ユニバーサル・ワンダーランド',icon:'🌈',rides:[
    {id:'r11',icon:'✈️',name:'スヌーピーのフライング・エース・アドベンチャー',sub:'スヌーピー空中戦'},
    {id:'r12',icon:'🛫',name:'フライング・スヌーピー',sub:'ふわふわ空中散歩'},
    {id:'r13',icon:'🎀',name:'ハローキティのカップケーキ・ドリーム',sub:'可愛いカップライド'},
  ]},
  {area:'ジュラシック・パーク',icon:'🦕',rides:[
    {id:'r14',icon:'🦖',name:'ザ・フライング・ダイナソー',sub:'逆さ吊りコースター'},
    {id:'r15',icon:'🌊',name:'ジュラシック・パーク・ザ・ライド',sub:'激流系ウォーターライド'},
  ]},
  {area:'ハリウッド・エリア',icon:'🎬',rides:[
    {id:'r16',icon:'🔄',name:'ハリウッド・ドリーム ～バックドロップ～',sub:'後ろ向きコースター'},
    {id:'r17',icon:'🎢',name:'ハリウッド・ドリーム・ザ・ライド',sub:'爽快コースター'},
    {id:'r18',icon:'🌌',name:'スペース・ファンタジー・ザ・ライド',sub:'宇宙旅行シューター'},
    {id:'r19',icon:'🎸',name:'ユニバーサル・モンスター・ライブ・ロックンロール・ショー',sub:'ライブショー'},
    {id:'r20',icon:'🐒',name:'プレイング・ウィズおさるのジョージ',sub:'キッズアトラクション'},
    {id:'r21',icon:'🎤',name:'シング・オン・ツアー',sub:'4Dライブショー'},
  ]},
  {area:'アミティ・ビレッジ',icon:'🦈',rides:[
    {id:'r22',icon:'🚤',name:'ジョーズ',sub:'サメのスリルボートライド'},
  ]},
  {area:'ウォーターワールド',icon:'💧',rides:[
    {id:'r23',icon:'🌊',name:'ウォーターワールド',sub:'超大型ライブショー'},
  ]},
];
const ALL_RIDES=RIDE_AREAS.flatMap(a=>a.rides);
const FOOD=[
  {id:'f0',icon:'🙅',name:'希望なし',sub:'どこでもOK！',skip:true},
  {id:'f1',icon:'🍺',name:'バタービール',sub:'ハリポタエリア'},
  {id:'f2',icon:'🍗',name:'ターキーレッグ',sub:'ジュラシックエリア'},
  {id:'f3',icon:'🍩',name:'三ツ目チョコドーナツ',sub:'ミニオン限定'},
  {id:'f4',icon:'🎃',name:'かぼちゃジュース',sub:'ハリポタエリア'},
  {id:'f5',icon:'🍦',name:'クロワッサン・アイス',sub:'人気スイーツ'},
  {id:'f6',icon:'🥘',name:'クラムチャウダー',sub:'ブレッドボウル入り'},
  {id:'f7',icon:'🍱',name:'マリオランチボックス',sub:'フォトジェニック弁当'},
  {id:'f8',icon:'🧁',name:'ハニーデュークスのお菓子',sub:'魔法菓子店'},
  {id:'f9',icon:'🍔',name:'バーガー各種',sub:'クラシックアメリカン'},
  {id:'f10',icon:'🌿',name:'キノコのキッシュ',sub:'ニンテンドーワールド'},
  {id:'f11',icon:'🍹',name:'パーク限定スムージー',sub:'フルーツフレーバー'},
  {id:'f12',icon:'🍫',name:'チョコレートフロッグ',sub:'ハリポタ限定'},
];

let ridesSelected=[],foodSelected=[],myName='',hasVoted=false;

function selClass(i){return['sel-1','sel-2','sel-3'][i]||'';}
function pipClass(i){return['pip-1','pip-2','pip-3'][i]||'';}

function toggle(id,type){
  if(hasVoted)return;
  if(type==='food'){
    const item=FOOD.find(x=>x.id===id);
    if(item&&item.skip){foodSelected=foodSelected.includes('f0')?[]:['f0'];renderLists();return;}
    if(foodSelected.includes('f0'))foodSelected=[];
  }
  const arr=type==='rides'?ridesSelected:foodSelected;
  const idx=arr.indexOf(id);
  if(idx>=0)arr.splice(idx,1);
  else{if(arr.length>=3)return;arr.push(id);}
  renderLists();
}

function renderLists(){
  let rHtml='';
  RIDE_AREAS.forEach(area=>{
    rHtml+=`<div class="area-div">${area.icon} ${area.area}</div>`;
    area.rides.forEach(item=>{
      const idx=ridesSelected.indexOf(item.id);
      const isSel=idx>=0;
      const disabled=(ridesSelected.length>=3&&!isSel)||hasVoted;
      const pip=isSel?`<div class="rank-pip ${pipClass(idx)}">${idx+1}</div>`:'';
      rHtml+=`<div class="item ${isSel?selClass(idx):''}${disabled?' disabled':''}" onclick="${disabled?'':` toggle('${item.id}','rides')`}">
        <div class="item-thumb">${item.icon}</div>
        <div style="flex:1;min-width:0"><div class="item-name">${item.name}</div><div class="item-sub">${item.sub}</div></div>
        ${pip}</div>`;
    });
  });
  document.getElementById('rides-list').innerHTML=rHtml;
  document.getElementById('rides-count').textContent=ridesSelected.length+'/3 選択中';

  const skipActive=foodSelected.includes('f0');
  document.getElementById('food-list').innerHTML=FOOD.map(item=>{
    const idx=foodSelected.indexOf(item.id);
    const isSel=idx>=0;
    const disabled=(skipActive&&!item.skip)||(foodSelected.length>=3&&!isSel&&!item.skip)||hasVoted;
    const sc=isSel?(item.skip?'sel-skip':selClass(idx)):'';
    const pip=isSel&&!item.skip?`<div class="rank-pip ${pipClass(idx)}">${idx+1}</div>`:
              isSel&&item.skip?`<div class="rank-pip pip-skip">✓</div>`:'';
    return `<div class="item ${sc}${item.skip?' skip':''}${disabled?' disabled':''}" onclick="${disabled?'':` toggle('${item.id}','food')`}">
      <div class="item-thumb">${item.icon}</div>
      <div style="flex:1;min-width:0"><div class="item-name">${item.name}</div><div class="item-sub">${item.sub}</div></div>
      ${pip}</div>`;
  }).join('');
  document.getElementById('food-count').textContent=(skipActive?'希望なし':foodSelected.length+'/3')+' 選択中';
}

async function submitVote(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){alert('名前を入力してください');return;}
  if(!ridesSelected.length&&!foodSelected.length){alert('アトラクションかフードを選んでください');return;}
  myName=name;
  const btn=document.getElementById('submitBtn');
  btn.textContent='送信中...';btn.disabled=true;
  try{
    await sbFetch('votes','POST',{
      name,
      rides:ridesSelected,
      food:foodSelected
    });
    hasVoted=true;
    btn.textContent='✅ 投票完了！';
    document.getElementById('nameInput').disabled=true;
    renderLists();
    showToast('投票しました！');
    await loadResults();
  }catch(e){
    console.error(e);
    alert('送信に失敗しました。時間をおいて再試行してください。');
    btn.textContent='投票する 🎉';btn.disabled=false;
  }
}

function calcScores(votes,items){
  const scores={},voters={};
  items.filter(x=>!x.skip).forEach(x=>{scores[x.id]=0;voters[x.id]=[];});
  votes.forEach(v=>{
    const arr=items===ALL_RIDES?v.rides:v.food;
    (arr||[]).filter(id=>id!=='f0').forEach((id,i)=>{
      if(scores[id]!==undefined){scores[id]+=(3-i);voters[id].push({name:v.name,rank:i+1});}
    });
  });
  return items.filter(x=>!x.skip).map(x=>({...x,pts:scores[x.id],voters:voters[x.id]||[]})).sort((a,b)=>b.pts-a.pts);
}

function renderRank(sorted,elId){
  const el=document.getElementById(elId);
  const withVotes=sorted.filter(x=>x.pts>0);
  if(!withVotes.length){el.innerHTML='<div class="empty-msg">まだ投票がありません</div>';return;}
  el.innerHTML=withVotes.map((item,i)=>{
    const voterHtml=item.voters.length?`<div class="voted-by">${item.voters.map(v=>`<span class="r${v.rank}">${v.name} ${v.rank}位</span>`).join('')}</div>`:'';
    return `<div class="rank-row">
      <div class="rank-num${i<3?' top':''}">${i+1}</div>
      <div class="rank-thumb">${item.icon}</div>
      <div style="flex:1;min-width:0"><div class="rank-name">${item.name}</div>${voterHtml}</div>
      <div class="votes-badge has">${item.pts}票</div>
    </div>`;
  }).join('');
}

async function loadResults(){
  try{
    const votes=await sbFetch('votes?select=name,rides,food&order=created_at.asc');
    document.getElementById('voter-list').innerHTML=(votes&&votes.length)
      ?votes.map(v=>`<div class="chip${v.name===myName?' me':''}">${v.name}${v.name===myName?' ✓':''}</div>`).join('')
      :'<div class="chip">まだ投票者なし</div>';
    renderRank(calcScores(votes||[],ALL_RIDES),'rides-rank');
    renderRank(calcScores(votes||[],FOOD),'food-rank');
  }catch(e){
    console.error(e);
    document.getElementById('rides-rank').innerHTML='<div class="empty-msg">読み込みエラー</div>';
  }
}

renderLists();
</script>
